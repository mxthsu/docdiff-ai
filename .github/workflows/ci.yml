name: Checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_docling_integration:
        description: Run optional PDF/DOCX/PPTX integration tests (installs Docling)
        type: boolean
        required: false
        default: false
      run_ui_smoke:
        description: Run Streamlit UI smoke test (installs UI dependencies)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check agent skills
        run: python .github/scripts/check_skills.py
      - name: Install optional document conversion dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docling_integration }}
        run: python -m pip install -e '.[documents,integration-tests]'
      - name: Test actual PDF/DOCX/PPTX conversion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docling_integration }}
        run: python -m unittest discover -s tests/integration -v
      - name: Install optional Streamlit dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke }}
        run: python -m pip install -e '.[ui]'
      - name: Test Streamlit workspace without browser or provider
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke }}
        run: python scripts/smoke_ui.py
